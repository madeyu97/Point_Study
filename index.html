/* ============ UNIFIED SESSIONS — one pool, weighted differently ============ */
function itemFamily(k){
  if(k.indexOf('diff:')===0)return 'diff';
  if(k.indexOf('cat:')===0)return 'cats';
  if(k.indexOf('rg:')===0)return 'region';
  if(k.indexOf('cn:')===0)return 'matrix';
  if(k.indexOf('clin:')===0)return 'clin';
  if(k.indexOf('envoy:')===0)return 'envoy';
  if(k.indexOf('dui:')===0)return 'dui';
  if(k.indexOf('safe:')===0)return 'safe';
  if(k.indexOf('hz:')===0)return 'chars';
  if(k.indexOf('case:')===0)return 'case';
  if(k.endsWith(':map'))return 'map';
  if(k.endsWith(':next'))return 'location';
  return 'point';
}
const SESSION_SPECS={
  daily:{id:'daily',gl:'課',name:'Daily Goal',cn:'日課',pri:1,daily:true,
    what:'Everything due, then new cards up to your daily goal',
    w:{point:30,location:10,map:9,cats:8,region:6,matrix:5,clin:5,envoy:4,dui:4,safe:3,diff:5,chars:4,case:6}},
  balanced:{id:'balanced',gl:'均',name:'Balanced Practice',cn:'均習',
    what:'A little of everything — names, locations, channels, functions, cases',
    w:{point:30,location:10,map:9,cats:8,region:6,matrix:5,clin:5,envoy:4,dui:4,safe:3,diff:5,chars:4,case:6}},
  reviewonly:{id:'reviewonly',gl:'復',name:'Review Only',cn:'復習',reviewOnly:true,
    what:'Only what is due — nothing new introduced'},
  leech:{id:'leech',gl:'頑',name:'Struggling Cards',cn:'頑固',leech:true,
    what:'The cards that keep beating you — shown answer-first, then tested'},
  timed:{id:'timed',gl:'時',name:'Timed Sprint',cn:'限時',timed:true,
    what:'Set a clock and see how far you get — no fixed card count',
    w:{point:30,location:10,map:9,cats:8,region:6,matrix:5,clin:5,envoy:4,dui:4,safe:3,diff:5,chars:4,case:4}}
};
const ITEM_COST=it=>it.kind==='case'?6:1;
let _poolCache=null,_poolSig='';
function poolSignature(){return JSON.stringify([ST.filters||{},ST.archived||{},ST.edits||{},licensed()])}
function invalidatePool(){_poolCache=null;_poolSig=''}
function unifiedPool(){
  const sig=poolSignature();
  if(_poolCache&&_poolSig===sig)return _poolCache.slice();
  const built=buildUnifiedPool();
  _poolCache=built;_poolSig=sig;return built.slice()}
function buildUnifiedPool(){
  const src=[].concat(
    pointItems(DB.points,['loc','func','name2fn','name2loc']),
    locationItems(DB.points), buildFunc(), buildMatrix(), buildClinic(),
    buildEnvoy(), buildDui(), buildSafe(),
    buildMapItems(CHAN.filter(c=>c!=='Extra')), buildDiffItems(),
    buildCats(), buildRegion(), buildCharItems());
  // several builders legitimately share a key (same fact, different presentation) —
  // keep one at random so a session never shows the same card twice
  const by={};src.forEach(it=>{(by[it.key]=by[it.key]||[]).push(it)});
  return sessionItems(liveItems(Object.keys(by).map(k=>by[k].length===1?by[k][0]:sample(by[k],1)[0])));
}
function caseEntries(){if(!famOn('case'))return [];return liveItems(buildCases().map(c=>Object.assign({},c,{kind:'case',deck:'Case',tagText:c.label||'Clinical case'})))}
function weightedPickN(groups,weights,n){
  const out=[];const w=Object.assign({},weights);let guard=0;
  while(out.length<n&&guard++<4000){
    const live=Object.keys(groups).filter(f=>groups[f].length&&(w[f]||0)>0);
    if(!live.length)break;
    const tot=live.reduce((s,f)=>s+w[f],0);
    let r=Math.random()*tot,pick=live[0];
    for(const f of live){r-=w[f];if(r<=0){pick=f;break}}
    out.push(groups[pick].shift());
  }
  return out}
function weightedPick(groups,weights,budget){
  const out=[];const w=Object.assign({},weights);let left=budget,guard=0;
  while(left>0&&guard++<4000){
    const live=Object.keys(groups).filter(f=>groups[f].length&&(w[f]||0)>0);
    if(!live.length)break;
    const tot=live.reduce((s,f)=>s+w[f],0);
    let r=Math.random()*tot,pick=live[0];
    for(const f of live){r-=w[f];if(r<=0){pick=f;break}}
    const it=groups[pick][0],c=ITEM_COST(it);
    if(c>left){w[pick]=0;continue}      // can't afford this family's next item — stop drawing from it
    groups[pick].shift();out.push(it);left-=c;
  }
  return out;
}
function buildUnifiedQueue(spec,target){
  const pool=unifiedPool();
  const all=(spec.reviewOnly||(spec.w&&spec.w.case>0))?pool.concat(caseEntries()):pool;
  const isDue=it=>{const s=ST.srs[it.key];return s&&s.due<=now()};
  const byUrgency=(a,b)=>((ST.srs[b.key].leech?1:0)-(ST.srs[a.key].leech?1:0))||(itemImp(b)-itemImp(a));
  const grp=arr=>{const g={};arr.forEach(it=>{const f=itemFamily(it.key);(g[f]=g[f]||[]).push(it)});return g};

  // Daily Goal: EVERY due card first, then new cards until the goal is met.
  if(spec.daily){
    const due=all.filter(isDue).sort(byUrgency);
    const left=Math.max(0,(ST.dailyGoal||30)-(ST.todayCount||0)-due.length);
    let q=due.slice();
    if(left>0){
      const newG=grp(shuffle(all.filter(it=>!ST.srs[it.key])));
      Object.keys(newG).forEach(f=>newG[f].sort((a,b)=>itemImp(b)-itemImp(a)));
      q=q.concat(weightedPickN(newG,spec.w,left));
    }
    return spreadByPoint(shuffle(q));
  }
  if(spec.reviewOnly){
    const due=spreadByPoint(all.filter(isDue).sort(byUrgency));
    if(!target)return due;                  // leech-first, then spread; do not reshuffle
    const q=[];let left=target;
    for(const it of due){const c=ITEM_COST(it);if(c>left)continue;q.push(it);left-=c}
    return q;
  }
  const dueG=grp(all.filter(isDue));Object.keys(dueG).forEach(f=>dueG[f].sort(byUrgency));
  const newG=grp(shuffle(all.filter(it=>!ST.srs[it.key])));
  Object.keys(newG).forEach(f=>newG[f].sort((a,b)=>itemImp(b)-itemImp(a)));
  const newBudget=Math.max(2,Math.round((ST.newCap||12)*target/50));
  const picked=weightedPick(dueG,spec.w,Math.max(0,target-newBudget))
        .concat(weightedPick(newG,spec.w,newBudget));
  let spent=picked.reduce((s,it)=>s+ITEM_COST(it),0);
  if(spent<target){
    const taken=new Set(picked.map(it=>it.key));
    const laterG=grp(all.filter(it=>{const s=ST.srs[it.key];return s&&s.due>now()&&!taken.has(it.key)}));
    Object.keys(laterG).forEach(f=>laterG[f].sort((a,b)=>ST.srs[a.key].due-ST.srs[b.key].due));
    picked.push(...weightedPick(laterG,spec.w,target-spent));
  }
  return spreadByPoint(shuffle(picked));
}
function startUnified(mount,specId){
  if(specId==='leech'){
    const q=shuffle(leechItems());
    if(!q.length){mount.innerHTML=vhead('Struggling Cards','頑固')+`<div class="done"><div class="han">畢</div><h2>Nothing struggling</h2><p>No card has tripped you up four times. Come back if one does.</p><div class="actions" style="margin-top:16px"><button class="btn primary" onclick="go('home')">Home</button></div></div>`;go('view');return}
    startQuiz(mount,q,{title:'Struggling Cards',cn:'頑固',deck:'Struggling',sessionMode:'preset',preset:'leech',studyFirst:true},'leech');
    return;
  }
  const spec=SESSION_SPECS[specId];if(!spec)return;
  if(spec.timed){
    const mins=ST.sprintMins||10;
    // a generous queue; the clock ends the session, not the card count
    const queue=buildUnifiedQueue(spec,400);
    startQuiz(mount,queue,{title:spec.name,cn:spec.cn,deck:spec.name,sessionMode:'preset',preset:specId,limitMs:mins*60000},specId);
    return;
  }
  const queue=buildUnifiedQueue(spec,spec.daily?0:(ST.practiceSize||20));
  if(!queue.length){
    mount.innerHTML=vhead(spec.name,spec.cn)+`<div class="done"><div class="han">畢</div><h2>Nothing waiting</h2><p>${spec.daily?'Your goal is met and nothing is due. Come back later, or pick another session.':'Nothing due in the material you have switched on.'}</p><div class="actions" style="margin-top:16px"><button class="btn primary" onclick="go('home')">Home</button></div></div>`;
    go('view');return;
  }
  startQuiz(mount,queue,{title:spec.name,cn:spec.cn,deck:spec.name,sessionMode:'preset',preset:specId},specId);
}

/* ============ IN-SESSION POINT EDITING ============ */
/* Which point (if any) is a card actually about — so it can be corrected on the
   spot, and so channel/tier scope can be judged. */
function itemPoint(it){if(!it||!it.key)return null;const k=it.key,s=k.split(':');
  if(ptById[s[0]])return ptById[s[0]];
  if(k.indexOf('cat:role:')===0)return ptById[s[2]]||null;
  if(k.indexOf('cat:pick:')===0)return ptById[s[3]]||null;
  if(k.indexOf('cat:name:')===0){const c=DB.categoryNaming.find(x=>norm(x.channel)===s[2]&&norm(x.category)===s[3]);
    return c?(DB.points.find(p=>norm(p.pinyin)===norm(c.pinyin))||null):null}
  if(k.indexOf('rg:')===0){
    // rg:r:<row>:<pointId> — a row naming several points makes one card each,
    // so prefer the id in the key over the first point in the row.
    if(s[3]&&ptById[s[3]])return ptById[s[3]];
    const e=DB.envoy[+s[2]];return e?resolveCode(e.answer):null}
  if(k.indexOf('diff:')===0)return ptById[s[2]]||null;
  if(k.indexOf('cn:')===0){const c=DB.categoryNaming.find(x=>x.channel===s[1]&&x.category===s[2]);
    return c?(DB.points.find(p=>norm(p.pinyin)===norm(c.pinyin))||null):null}
  if(k.indexOf('safe:')===0){const c=DB.contraindications[+s[1]];if(!c)return null;
    // contraindications name the point in pinyin ("Jíquán"), not as a code
    return resolveCode(c.point)||DB.points.find(p=>norm(p.pinyin)===norm(c.point))||null}
  return null}
/* After an edit, rebuild the card so the correction shows immediately. */
function regenItem(it){const s=it.key.split(':'),p=ptById[s[0]];if(!p)return it;
  if(['loc','func','name2fn','name2loc'].indexOf(s[1])>=0)return pointItems([p],[s[1]])[0]||it;
  if(s[1]==='next')return locationItems([p]).find(x=>x.key===it.key)||it;
  if(s[1]==='map')return buildMapItems([p.channel]).find(x=>x.key===it.key)||it;
  return it}

function openMode(id,preChan){const m=$('#viewMount');m.innerHTML='';go('view');ac();
  if(id==='practice'){startQuiz(m,allItems(),{title:'Mixed Practice',cn:'復習',deck:'Mixed',sessionMode:'mixed',excludeAux:true},'practice');return}
  if(id==='revise'){startQuiz(m,allItems(),{title:'Revise',cn:'復習',deck:'Due',sessionMode:'revise'},'revise');return}
  if(id==='learn'){
    const started=p=>['loc','func','name2fn','name2loc'].some(d=>ST.srs[p.id+':'+d]);
    let pts=DB.points.filter(p=>!started(p));
    const ord=ST.learnOrder||'priority';
    if(ord==='priority')pts.sort((a,b)=>priorityScore(b.id)-priorityScore(a.id)||(a.code<b.code?-1:1)||a.num-b.num);
    else if(ord==='random')pts=shuffle(pts);
    pts=pts.slice(0,ST.newCap||12);
    const items=[];pts.forEach(p=>['loc','func','name2loc','name2fn'].forEach(dd=>{const it=pointItems([p],[dd])[0];if(it)items.push(it)}));
    startQuiz(m,items,{title:'Learn New Points',cn:'新學',deck:'New',sessionMode:'learn',ordered:true},'learn');return}
  if(id==='chars'){renderChars(m);return}
  if(id==='cmap'){renderChannelMap(m);return}
  if(SESSION_SPECS[id]){startUnified(m,id);return}
  if(id==='cases'){renderCases(m);return}

/* ============ BACKUP (export / import) ============ */
function exportState(){return JSON.stringify({app:'jingxue',v:7,exported:new Date().toISOString(),state:ST})}
function downloadBackup(){const data=exportState();
  try{const blob=new Blob([data],{type:'application/json'});const url=URL.createObjectURL(blob);
    const a=document.createElement('a');a.href=url;a.download='jingxue-backup-'+todayStr()+'.json';
    document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),3000);
    toast('存','Backup exported','Saved jingxue-backup-'+todayStr()+'.json — keep it somewhere safe.');
  }catch(e){alert('Download is not available here. Use “Copy backup” instead and paste it into a note.')}}
function fallbackCopy(text){const ta=document.createElement('textarea');ta.value=text;ta.style.position='fixed';ta.style.top='-1000px';
  document.body.appendChild(ta);ta.focus();ta.select();let ok=false;try{ok=document.execCommand('copy')}catch(e){}ta.remove();return ok}
function copyBackup(){const data=exportState();const ok=()=>toast('存','Backup copied','Paste it into a note or message to keep it safe.');
  if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(data).then(ok).catch(()=>{if(fallbackCopy(data))ok()})}
  else if(fallbackCopy(data))ok();else alert('Could not copy automatically — use “Export file” instead.')}
function restoreState(text){
  let obj;try{obj=JSON.parse(text)}catch(e){alert('That does not look like valid backup text.');return false}
  const state=(obj&&obj.state&&typeof obj.state==='object')?obj.state:obj;
  if(!state||typeof state!=='object'||!state.srs||typeof state.srs!=='object'){alert('This file is missing progress data — it is not a Dojo backup.');return false}
  // drop any malformed card records rather than letting them break the app
  Object.keys(state.srs).forEach(k=>{const c=state.srs[k];
    if(!c||typeof c!=='object'||typeof c.due!=='number')delete state.srs[k]});
  const n=Object.keys(state.srs||{}).length;
  if(!confirm('Replace ALL progress on this device with this backup ('+n+' studied items, streak '+(state.streak||0)+')? This cannot be undone.'))return false;
  ST=sanitiseState(state);applyEdits();save();syncHeader();go('home');toast('復','Backup restored','Your progress has been loaded.');return true}

  const offT=[1,2,3,4,5].filter(t=>!tierOn(t)).length;
  if(!offF&&!offC&&!offT&&ptIncludedCount()===DB.points.length)return 'everything on';

function startQuiz(mount,items,opt,kind){items=liveItems(items||[]);
  combo=0;
  const sm=opt.sessionMode||'mixed';
  const newcap=ST.newCap||opt.newcap||12;
  let due=items.filter(it=>{const s=ST.srs[it.key];return s&&s.due<=now()});
  let neu=items.filter(it=>!ST.srs[it.key]);
  let later=items.filter(it=>{const s=ST.srs[it.key];return s&&s.due>now()});
  due.sort((a,b)=>((ST.srs[b.key].leech?1:0)-(ST.srs[a.key].leech?1:0))||(itemImp(b)-itemImp(a)));
  let queue;
  if(sm==='preset'){queue=items.slice()}
  else if(sm==='revise'){queue=spreadByPoint(shuffle(due).sort((a,b)=>((ST.srs[b.key].leech?1:0)-(ST.srs[a.key].leech?1:0))||(itemImp(b)-itemImp(a))))}
  else if(sm==='learn'){queue=opt.ordered?items.filter(it=>!ST.srs[it.key]):shuffle(neu).sort((a,b)=>itemImp(b)-itemImp(a)).slice(0,opt.cap||newcap)}
  else{let np=opt.excludeAux?neu.filter(it=>!isAux(it.key)):neu;np.sort((a,b)=>itemImp(b)-itemImp(a));queue=shuffle(due).concat(np.slice(0,newcap));if(!queue.length)queue=np.slice(0,newcap);if(!queue.length)queue=shuffle(later).slice(0,20)}
  if(opt.cap)queue=queue.slice(0,opt.cap);
  const learnMode=(sm==='learn');const met=new Set();
  if(!queue.length){
    const msg = sm==='learn' ? 'Every point here has been started — head to Revise to deepen them.'
              : sm==='revise' ? 'Nothing due right now. Learn some new points, or come back later.'
              : 'Nothing due in this deck right now.';
    mount.innerHTML=vhead(opt.title,opt.cn)+`<div class="done"><div class="han">畢</div><h2>${sm==='learn'?'All introduced':'All caught up'}</h2><p>${msg}</p><div class="actions" style="margin-top:16px">${sm==='revise'?'<button class="btn ghost" id="toLearn">Learn new</button>':''}<button class="btn primary" onclick="go('home')">Home</button></div></div>`;
    const tl=$('#toLearn');if(tl)tl.onclick=()=>openMode('learn');return}
  let total=queue.length;let idx=0,flipped=false,correctCount=0,xpEarned=0,maxCombo=0;
  let clockT=null,timeUp=false;
  const endAt=opt.limitMs?Date.now()+opt.limitMs:0;
  function stopClock(){if(clockT){clearInterval(clockT);clockT=null}}
  if(endAt){
    const cl=$('#qclock');
    const tick=()=>{const ms=Math.max(0,endAt-Date.now());
      const m=Math.floor(ms/60000),s=Math.floor(ms%60000/1000);
      if(cl){cl.textContent=m+':'+String(s).padStart(2,'0');cl.classList.toggle('low',ms<60000)}
      if(ms<=0&&!timeUp){timeUp=true;stopClock();finish()}};
    tick();clockT=setInterval(tick,1000);
  }
  mount.innerHTML=vhead(opt.title,opt.cn)+`
    <div class="qtop"><span class="qdeck" id="qdeck"></span><span class="combo" id="qcombo"></span><span class="spacer"></span><span class="qclock" id="qclock"></span><button class="qedit" id="qedit" title="Edit this point">✎</button><button class="qedit" id="qarch" title="Archive this card">⊘</button><span class="qcount" id="qcount"></span></div>
    <div class="qprog"><i id="qbar"></i></div>
    <div class="card" id="qcard"></div>
    <div class="qctrl" id="qctrl"></div>`;
  const card=$('#qcard'),ctrl=$('#qctrl');
  function setCombo(){const c=$('#qcombo');if(combo>=2){c.textContent='Combo ×'+combo;c.classList.add('show');c.classList.toggle('hot',combo>=5)}else c.classList.remove('show','hot');if(combo>maxCombo)maxCombo=combo}
  function render(){const it=queue[idx];flipped=false;shownCount[it.key]=(shownCount[it.key]||0)+1;
    $('#qdeck').textContent=(isLeech(it.key)?'頑 ':'')+(it.deck||opt.deck||'');$('#qcount').textContent=(idx+1)+' / '+total;$('#qbar').style.width=(idx/total*100)+'%';setCombo();
    card.className='card';void card.offsetWidth;card.classList.add('card');
    const ep=itemPoint(it),eb=$('#qedit');
    if(eb){eb.style.display=ep?'block':'none';
      eb.onclick=()=>openPointEditor(ep,()=>{queue[idx]=regenItem(queue[idx]);render()})}
    const ab=$('#qarch');
    if(ab){ab.style.display='block';
      ab.onclick=()=>{if(!confirm('Archive this card? It will not appear again until you restore it from Settings → Archived cards.'))return;
        archiveCard(it.key,cardLabel(it));
        toast('archived'.slice(0,1).toUpperCase(),'Card archived','Restore it any time from Settings.');
        queue.splice(idx,1);total=queue.length;
        if(!queue.length){finish();return}
        if(idx>=queue.length)idx=queue.length-1;
        render()}}
    if(it.kind==='case'){renderInlineCase(it);return}
    // Struggling-card drill: show the answer first, then test. Re-testing a card
    // you keep failing the same way is what has not been working.
    if(opt.studyFirst&&!met.has(it.key)){
      const lp=ST.srs[it.key];
      card.innerHTML=`<div class="tag">struggling · ${lp&&lp.lapses?lp.lapses+' lapses · ':''}study</div>`
        +it.promptHTML+`<div class="extra"><div class="l">answer</div>${it.answerHTML||''}</div>`;
      ctrl.innerHTML=`<div class="actions"><button class="flipbtn" id="sfnext">Test me →</button></div>`;
      $('#sfnext').onclick=()=>{met.add(it.key);sfx('tick');render()};
      return}
    if(learnMode&&it.studyHTML){const pid=it.key.split(':')[0];if(!met.has(pid)){
      const t=tierOf(pid),rs=impReasons(pid);
      const badge=`<div class="tierbadge t${t}">${tierLabel(t)}${rs.length?' · '+esc(rs.slice(0,3).join(' · ')):''}</div>`;
      card.innerHTML=`<div class="tag">new · study</div>`+badge+it.studyHTML;
      ctrl.innerHTML=`<div class="actions"><button class="flipbtn" id="learnnext">Test me →</button></div>`;
      $('#learnnext').onclick=()=>{met.add(pid);sfx('tick');render()};return}}
    card.innerHTML=`<div class="tag">${it.tagText||opt.deck||''}</div><div class="crit" id="crit">★ Critical ×2</div>`+it.promptHTML;
    if(it.choices){const box=el('div','choices');
      // reshuffled every time the card is shown, so a repeat never has the same
      // layout and the answer can't be remembered by position
      const shown=shuffle(it.choices);
      shown.forEach((c,n)=>{const b=el('button','choice',`<b>${'ABCDEF'[n]}</b>${c.html}`);
        b.onclick=()=>{Array.from(box.children).forEach(x=>x.disabled=true);
          Array.from(box.children).forEach((x,j)=>{if(shown[j].correct)x.classList.add('correct')});
          if(!c.correct)b.classList.add('wrong');sfx(c.correct?'good':'again');
          const ans=el('div','');ans.style.marginTop='14px';ans.innerHTML=it.answerHTML||'';card.appendChild(ans);
          if(it.onReveal)try{it.onReveal(card)}catch(e){}
          showGrades(it,c.correct)};
        box.appendChild(b)});
      card.appendChild(box);ctrl.innerHTML=''}
    else{ctrl.innerHTML=`<div class="actions"><button class="flipbtn" id="flip">Reveal</button></div>`;
      $('#flip').onclick=()=>{if(flipped)return;flipped=true;card.classList.add('flip');sfx('tick');
        setTimeout(()=>{card.innerHTML=`<div class="tag">answer</div>`+it.answerHTML;if(it.onReveal)try{it.onReveal(card)}catch(e){}},190);showGrades(it)}}
  }
  function renderInlineCase(it){let step=0,wrong=0;
    function draw(){const s=it.steps[step];
      card.innerHTML=`<div class="tag">${esc(it.tagText||'case')}</div>
        <div class="vignette"><div class="l">Clinical scenario</div><div class="v">${it.vignette}</div></div>
        <div class="casestep"><div class="q">${s.q}</div></div>`;
      const box=el('div','choices');
      const advance=()=>{
        if(s.explain){const e=el('div','explain');e.innerHTML=s.explain;card.appendChild(e)}
        ctrl.innerHTML=`<div class="actions"><button class="flipbtn" id="cstep">${step<it.steps.length-1?'Next step →':'See the case →'}</button></div>`;
        $('#cstep').onclick=()=>{step++;if(step<it.steps.length)draw();else done()}};
      if(s.kind==='multi'){
        const K=s.choices.filter(c=>c.correct).length;const picks=new Set();
        const sync=()=>{const cb=$('#cmulti'),h=ctrl.querySelector('.hint');
          if(cb){cb.disabled=picks.size!==K;cb.style.opacity=picks.size===K?'1':'.55'}
          if(h)h.textContent=`Select ${K}, then check — ${picks.size}/${K}`};
        s.choices.forEach((c,n)=>{const b=el('button','choice',`<b>${'ABCDEF'[n]}</b>${c.html}`);
          b.onclick=()=>{if(b.disabled)return;
            if(picks.has(n)){picks.delete(n);b.classList.remove('sel')}
            else if(picks.size<K){picks.add(n);b.classList.add('sel')}
            sync()};
          box.appendChild(b)});
        card.appendChild(box);
        ctrl.innerHTML=`<div class="hint">Select ${K}, then check — 0/${K}</div><div class="actions"><button class="flipbtn" id="cmulti" disabled style="opacity:.55">Check ▸</button></div>`;
        $('#cmulti').onclick=()=>{if(picks.size!==K)return;let bad=false;
          s.choices.forEach((c,j)=>{const x=box.children[j];x.disabled=true;
            if(c.correct)x.classList.add(picks.has(j)?'correct':'missed');
            else if(picks.has(j)){x.classList.add('wrong');bad=true}
            if(c.correct&&!picks.has(j))bad=true});
          if(bad)wrong++;sfx(bad?'again':'good');
          const h=ctrl.querySelector('.hint');if(h)h.remove();
          advance()};
        return}
      s.choices.forEach((c,n)=>{const b=el('button','choice',`<b>${'ABCDEF'[n]}</b>${c.html}`);
        b.onclick=()=>{Array.from(box.children).forEach(x=>x.disabled=true);
          s.choices.forEach((cc,j)=>{if(cc.correct)box.children[j].classList.add('correct')});
          if(!c.correct){b.classList.add('wrong');wrong++}
          sfx(c.correct?'good':'again');
          advance()};
        box.appendChild(b)});
      card.appendChild(box);ctrl.innerHTML='';}
    function done(){card.innerHTML=`<div class="tag">case review</div><div class="recap">${it.recap}</div>`+reviewDetail(it.review||[]);
      showGrades(it,wrong===0)}
    draw()}
  function showGrades(it,mcqCorrect){
    setTimeout(()=>{
      const g=el('div','grades');
      g.innerHTML=`<button class="grade again" data-g="0">Again<small>&lt;1m</small></button>
        <button class="grade hard" data-g="1">Hard</button>
        <button class="grade good" data-g="2">Good</button>
        <button class="grade easy" data-g="3">Easy</button>`;
      ctrl.innerHTML='';const xf=el('div','xpfloat');xf.id='xpf';ctrl.appendChild(g);ctrl.appendChild(xf);
      g.querySelectorAll('.grade').forEach(b=>b.onclick=()=>{const gr=+b.dataset.g;
        if(gr>=2)combo++;else if(gr===0)combo=0;
        if(gr>=2)correctCount++;
        const xp=review(it.key,gr);xpEarned+=xp;
        // A card graded Again/Hard goes back into learning and is due within
        // minutes. Re-queue it now so the session genuinely clears the work
        // instead of ending with cards still due.
        if(gr<2&&opt.drain!==false&&(shownCount[it.key]||0)<5){
          const at=Math.min(queue.length,idx+3+Math.floor(Math.random()*3));
          queue.splice(at,0,it);total=queue.length;
        }
        sfx(gr===0?'again':gr===1?'hard':gr===3?'easy':'good');
        if(gr>=2){const cr=$('#crit');if(lastCrit&&cr){cr.classList.add('show')}
          const f=$('#xpf');if(f){f.textContent='+'+xp+(lastCrit?' ★':'');f.classList.remove('go');void f.offsetWidth;f.classList.add('go')}}
        if(combo>0&&combo%5===0)burst('gold',innerWidth/2,innerHeight*0.55);
        save();syncHeader();
        if(gr===0){queue.push(it)}
        setTimeout(next,lastCrit&&gr>=2?520:300)})
    },flipped&&!it.choices?210:0)
  }
  function next(){if(pendingLevel){const L=pendingLevel;pendingLevel=null;showLevelUp(L)}idx++;if(idx>=queue.length){finish();return}render()}
  let sweeps=0;const shownCount={};
  function finish(){
    // Daily Goal and Review Only promise to clear the work: before declaring
    // the session over, pick up anything that fell due while you were studying.
    if(!timeUp&&(opt.preset==='daily'||opt.preset==='reviewonly')&&sweeps<4){
      sweeps++;
      const more=buildUnifiedQueue(SESSION_SPECS[opt.preset],0).filter(x=>(shownCount[x.key]||0)<5);
      if(more.length){queue=queue.concat(more);total=queue.length;render();return}
    }
    stopClock();checkAch();save();syncHeader();$('#qbar').style.width='100%';
    const acc=total?Math.round(correctCount/total*100):0;
    mount.innerHTML=vhead(opt.title,opt.cn)+`<div class="done"><div class="han">畢</div><h2>Session complete</h2>
      <div class="stats"><div class="stat"><b>${total}</b><span>cards</span></div><div class="stat"><b>+${xpEarned}</b><span>XP</span></div><div class="stat"><b>×${maxCombo}</b><span>best combo</span></div><div class="stat"><b>${acc}%</b><span>recalled</span></div></div>
      <p style="color:var(--paper-faint)">Streak ${ST.streak} · ${reviseDueCount()} still due to revise.</p>
      <div class="actions" style="margin-top:18px"><button class="btn ghost" id="again">Another round</button><button class="btn primary" onclick="go('home')">Home</button></div></div>`;
    burst('gold');$('#again').onclick=()=>{if(opt.preset)startUnified(mount,opt.preset);else startQuiz(mount,items,opt,kind)}}
  render()
}

      if(!ptUnlocked(p.id))d.classList.add('locked');
      d.innerHTML=`<div class="top"><span class="han">${esc(p.hanzi)}</span><span class="py">${esc(p.pinyin)}</span>${p.english?`<span class="en">${esc(p.english)}</span>`:''}
        <span style="margin-left:auto;display:flex;align-items:center;gap:9px">${isEdited(p.id)?'<span class="echip">edited</span>':''}<span class="tchip t${t}">${tierLabel(t)}</span><span class="code">${p.code}-${p.num}</span><button class="star${pinned?' on':''}" data-pin="${p.id}" title="Pin as priority">${pinned?'★':'☆'}</button><button class="star" data-edit="${p.id}" title="Edit this point">✎</button></span></div>
        <div class="loc">${esc(p.location)}</div><div class="fns">${p.functions.map(f=>`<span>${esc(f)}</span>`).join('')}</div>
        ${p.categories.length?`<div class="roles">${p.categories.map(c=>`<span>${esc(c)}</span>`).join('')}</div>`:''}
        ${p.note?`<div class="loc" style="color:var(--gold)">✎ ${esc(p.note)}</div>`:''}
        <div class="editpanel" id="ep-${p.id}" style="display:none"></div>
        ${p.cautions.length?`<div class="caut">⚠ ${esc([...new Set(p.cautions.flatMap(c=>c.notes))].join(' · '))}</div>`:''}`;box.appendChild(d)});
    box.querySelectorAll('[data-pin]').forEach(b=>b.onclick=()=>{const id=b.dataset.pin;ST.pins=ST.pins||{};if(ST.pins[id])delete ST.pins[id];else ST.pins[id]=1;save();draw()});
    box.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>{const id=b.dataset.edit;const p=ptById[id];const ep=$('#ep-'+id);
      if(ep.style.display!=='none'){ep.style.display='none';ep.innerHTML='';return}
      ep.innerHTML=`
        <div class="erow"><label>Characters 漢字</label><input class="search ein" id="e-hz" value="${esc(p.hanzi)}"></div>
        <div class="erow"><label>Pinyin</label><input class="search ein" id="e-py" value="${esc(p.pinyin)}"></div>
        <div class="erow"><label>English name</label><input class="search ein" id="e-en" value="${esc(p.english)}"></div>
        <div class="erow"><label>Location</label><textarea class="search ein" id="e-loc" style="height:70px">${esc(p.location)}</textarea></div>
        <div class="erow"><label>Functions — one per line</label><textarea class="search ein" id="e-fn" style="height:88px">${esc(p.functions.join('\n'))}</textarea></div>
        <div class="erow"><label>Personal note (shows on study cards)</label><textarea class="search ein" id="e-note" style="height:52px">${esc(p.note||'')}</textarea></div>
        <div class="actions" style="justify-content:flex-start;gap:9px">
          <button class="btn primary" id="e-save">Save</button>
          <button class="btn ghost" id="e-cancel">Cancel</button>
          ${isEdited(id)?'<button class="btn ghost" id="e-restore" style="margin-left:auto;color:var(--seal)">Restore default</button>':''}
        </div>
        <div class="count" style="margin-top:7px">Changes apply everywhere this point appears — cards, maps, cases, clinic. Your study schedule is untouched. Defaults are always recoverable.</div>`;
      ep.style.display='block';
      $('#e-save').onclick=()=>{const py=($('#e-py').value||'').trim();
        if(!py){alert('Pinyin cannot be empty — it names the point across the app.');return}
        const fns=($('#e-fn').value||'').split('\n').map(s=>s.trim()).filter(Boolean);
        savePointEdit(id,{hanzi:($('#e-hz').value||'').trim(),pinyin:py,english:($('#e-en').value||'').trim(),location:($('#e-loc').value||'').trim(),functions:fns,note:$('#e-note').value||''});
        toast('改','Point updated',p.code+'-'+p.num+' — your version now shows everywhere.');draw()};
      $('#e-cancel').onclick=()=>{ep.style.display='none';ep.innerHTML=''};
      const er=$('#e-restore');if(er)er.onclick=()=>{if(confirm('Restore '+p.code+'-'+p.num+' to the built-in data? Your custom text and note for this point will be removed.')){restorePoint(id);toast('復','Default restored',p.code+'-'+p.num);draw()}};});
    if(list.length>300)box.appendChild(el('div','count','Showing first 300 — refine your search.'))}
  draw()}

/* ============ SERVICE WORKER ============ */
if('serviceWorker' in navigator){addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}

/* boot */
renderHome();
</script>
</body>
</html>
